<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk - fresh take mockup</title>
<meta name="viewport" content="width=1245">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --line:#dde2ea; --line2:#eceff4; --ink:#17202b; --mut:#66738a; --faint:#9aa5b6;
  --up:#0b8a5c; --upbg:#e3f4ec; --dn:#c62f3a; --dnbg:#fbe9eb; --amb:#a8650a; --ambbg:#fdf1dd;
  --blue:#2358c7; --bluebg:#e7eefb; --grey:#8a95a6; --greybg:#eef0f4; --orange:#d9731a; --orbg:#fdeede;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:13px/1.3 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
body{width:1245px;height:720px;overflow:hidden}
#app{width:1245px;overflow:hidden;grid-template-columns:minmax(0,1fr);height:720px;display:grid;grid-template-rows:36px 78px minmax(0,1fr) 70px 28px;gap:6px;padding:6px 10px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;overflow:hidden;position:relative}
.h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.h small{letter-spacing:0;text-transform:none;font-weight:400;color:var(--faint);font-size:10.5px}
/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:0 2px}
#top .brand{font-weight:700;letter-spacing:.04em;font-size:14px}
#top .clock{font-size:15px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--mut);white-space:nowrap}
.chip.b{background:var(--bluebg);border-color:#c5d4f4;color:var(--blue)}
.chip.a{background:var(--ambbg);border-color:#f1d9a8;color:var(--amb)}
.chip.o{background:var(--orbg);border-color:#f3cfa5;color:var(--orange)}
.chip.g{background:var(--greybg);color:var(--mut)}
.chip.up{background:var(--upbg);border-color:#b8e3cf;color:var(--up)}
.chip.dn{background:var(--dnbg);border-color:#f1c0c4;color:var(--dn)}
.sp{flex:1}
/* index strip */
#strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ix{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.ix.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ix .r1,.ix .r2{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ix .nm{font-weight:700;font-size:13.5px}
.ix .px{color:var(--mut);font-size:11.5px}
.ix .st{font-size:17px;font-weight:700;letter-spacing:.01em}
.ix .age{font-size:11px;color:var(--mut)}
.ix .star{position:absolute;right:8px;top:-8px;background:var(--ink);color:#fff;font-size:10px;padding:1px 7px;border-radius:9px;font-weight:600;letter-spacing:.03em}
.wbar{display:inline-flex;width:70px;height:7px;border-radius:4px;overflow:hidden;background:var(--greybg);vertical-align:middle}
.wbar i{display:block;height:100%}
.c-pu{color:#7e57c2} .c-up{color:var(--up)} .c-dn{color:var(--dn)} .c-am{color:var(--amb)} .c-bl{color:var(--blue)} .c-gr{color:var(--grey)} .c-or{color:var(--orange)}
/* main grid */
#main{display:grid;grid-template-columns:392px 430px minmax(0,1fr);gap:8px;min-height:0}
#main .card{display:flex;flex-direction:column;min-height:0}
/* col1 */
.big{display:flex;align-items:baseline;gap:10px}
.big .w{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1}
.big .s{font-size:12.5px;color:var(--mut)}
.since{font-size:11.5px;color:var(--mut);margin:3px 0 6px;line-height:1.35}
.ev{display:grid;grid-template-columns:18px 78px 1fr;gap:0 6px;padding:4px 0;border-top:1px solid var(--line2);align-items:start}
.ev .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;line-height:1.2;padding-top:3px}
.ev .v{font-size:12.5px;font-weight:700;line-height:1.25}
.ev .u{font-size:11px;color:var(--mut);line-height:1.25}
.lt{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;line-height:1;margin-top:2px}
.lt.g{background:var(--up);color:#fff}
.lt.a{background:var(--ambbg);color:var(--amb);border:1.5px solid #e2b768}
.lt.r{background:var(--dn);color:#fff}
.lt.n{background:#fff;color:var(--faint);border:1.5px dashed #b9c1ce}
.lt.i{background:var(--bluebg);color:var(--blue);border:1.5px solid #bcd0f3}
.flipbox{margin-top:auto;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:#fafbfc;font-size:11.5px;line-height:1.3}
.flipbox b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
/* col2 */
.banner{border-radius:7px;padding:8px 11px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.banner .t{font-size:17px;font-weight:800;letter-spacing:.01em}
.banner .d{font-size:12px;color:#33404f}
.banner.OK{background:var(--upbg);border:1px solid #b8e3cf}
.banner.HALF{background:#eaf5df;border:1px solid #cfe5b2}
.banner.WAIT{background:var(--ambbg);border:1px solid #f1d9a8}
.banner.NO{background:var(--greybg);border:1px solid var(--line)}
.banner.HOLD{background:var(--upbg);border:1px solid #b8e3cf}
.banner.WATCH{background:var(--ambbg);border:1px solid #f1d9a8}
.banner.FOLD{background:var(--dnbg);border:1px solid #f1c0c4}
.pl{display:grid;grid-template-columns:54px 1fr 150px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.pill{display:inline-block;text-align:center;padding:2px 0;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.04em;width:50px}
.pill.OK{background:var(--up);color:#fff}.pill.HALF{background:#7cb342;color:#fff}.pill.WAIT{background:var(--ambbg);color:var(--amb);border:1px solid #e2b768}.pill.NO{background:var(--greybg);color:var(--grey)}
.pl .n{font-weight:700;font-size:13px}
.pl .n small{font-weight:400;color:var(--mut);font-size:11px;margin-left:4px}
.pl .y{font-size:11.5px;color:var(--mut)}
.lights{display:flex;gap:5px;justify-content:flex-end}
.lights span{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8.5px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.lights .lt{margin:0;width:15px;height:15px;font-size:9px}
.wait{margin-top:7px;font-size:12px}
.wait b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.wait div{padding:2px 0}
.note{margin-top:auto;padding-top:6px;font-size:11px;color:var(--mut);border-top:1px solid var(--line2)}
.cap{background:var(--ambbg);border:1px solid #f1d9a8;color:var(--amb);border-radius:6px;padding:4px 8px;font-size:11.5px;margin-bottom:6px}
/* trade board */
.pos{border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin-bottom:7px;background:#fafbfc}
.pos .a{display:flex;justify-content:space-between;align-items:baseline}
.pos .a b{font-size:14px}
.pos .pnl{font-size:16px;font-weight:800}
.pos .b{font-size:11.5px;color:var(--mut);margin-top:2px}
.fb{display:grid;grid-template-columns:20px 62px 1fr 56px;gap:0 7px;align-items:start;padding:6px 0;border-top:1px solid var(--line2)}
.fb .k{font-size:11px;font-weight:700;letter-spacing:.05em}
.fb .v{font-size:12px}
.fb .v small{display:block;color:var(--mut);font-size:11px}
.fb .s{font-size:11px;font-weight:700;text-align:right}
/* col3 ladder */
.basis{font-size:11.5px;background:var(--bluebg);border:1px solid #c5d4f4;border-radius:6px;padding:4px 8px;margin-bottom:6px;color:#1d3f8f}
.lad{display:grid;grid-template-columns:48px 1fr 62px 46px 34px;gap:0 6px;align-items:center;font-size:12px}
.lad .row{display:contents}
.lad .row>*{padding:3px 0;border-top:1px solid var(--line2)}
.lad .tg{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-align:center;border-radius:4px;padding:1px 0;align-self:center}
.tg.FUT{background:var(--greybg);color:#4b586c}
.tg.STRIKE{background:var(--orbg);color:var(--orange)}
.lad .nm small{color:var(--mut);font-size:10.5px;margin-left:3px}
.lad .px{text-align:right;font-weight:600}
.lad .ds{text-align:right;color:var(--mut)}
.lad .sg{text-align:right;color:var(--faint);font-size:11px}
.lad .cur>*{background:#fff4c9;border-top:1px solid #e3c35a;border-bottom:1px solid #e3c35a;font-weight:800}
.lad .cur .tg{background:#17202b;color:#fff}
.lad .vw .nm{font-weight:800}
.wl{margin-top:8px;font-size:11.5px}
.wl table{width:100%;border-collapse:collapse}
.wl td,.wl th{padding:2px 4px;text-align:right;font-weight:500}
.wl th{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wl td:first-child,.wl th:first-child{text-align:left}
/* ribbon */
#rib{padding:6px 12px}
.rrow{display:flex;align-items:center;height:14px;margin-top:2px}
.rrow .l{width:78px;font-size:10px;color:var(--mut);font-weight:600}
.track{position:relative;flex:1;height:11px;background:repeating-linear-gradient(45deg,#f5f6f9,#f5f6f9 4px,#eef0f4 4px,#eef0f4 8px);border-radius:3px;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;display:block}
.axis{position:relative;margin-left:78px;height:12px;font-size:9.5px;color:var(--faint)}
.axis span{position:absolute;transform:translateX(-50%)}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.mk.cut{background:var(--dn);opacity:.7;width:1px}
/* controls */
#ctl{display:flex;align-items:center;gap:4px;border-top:1px dashed #c7cedb;padding-top:3px}
#ctl .lbl{font-size:10px;color:var(--faint);margin-right:2px;white-space:nowrap}
#ctl button{border:1px solid var(--line);background:#fff;border-radius:5px;font:inherit;font-size:11px;padding:1px 6px;cursor:pointer;color:var(--ink);height:21px;white-space:nowrap}
#ctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#ctl .cp{font-size:11px;color:var(--ink);margin-left:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.leg{display:flex;gap:9px;font-size:10.5px;color:var(--mut);align-items:center;margin-right:6px}
.leg span{display:inline-flex;align-items:center;gap:3px}
.leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.pre td,.pre th{padding:4px 6px;text-align:right;border-top:1px solid var(--line2);font-size:12px}
.pre th{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-top:none}
.pre td:first-child,.pre th:first-child{text-align:left;font-weight:700}
.pre{width:100%;border-collapse:collapse}
.tl{display:grid;grid-template-columns:48px 1fr;gap:3px 8px;font-size:12px;margin-top:4px}
.tl b{color:var(--ink)}
.tl span{color:var(--mut)}
.mini{font-size:11.5px;color:var(--mut)}
</style>
</head>

</div>

  near.push({p:F,tag:'FUT',nm:'ABHI',kind:'cur'});
  near.sort((a,b)=>b.p-a.p);
  let h=`<div class="lad">`;
  near.forEach(l=>{
    const cur=l.kind==='cur', ds=l.p-F;
    const extra = l.kind==='wall' ? '' : (l.kind==='prev'? `<small>${x.prev?x.prev.day.slice(8)+'/'+x.prev.day.slice(5,7):''}</small>`:(l.kind==='pin'?'<small>spot strike</small>':''));
    const nm = l.kind==='wall'? `${l.side==='ce'?'CE':'PE'} wall ${fm(l.strike)}` : l.nm;
    h+=`<div class="row ${cur?'cur':''} ${l.kind==='vwap'?'vw':''}"><span class="tg ${l.tag}">${l.tag}</span><span class="nm">${nm}${extra}</span><span class="px">${fm(l.p)}</span><span class="ds">${cur?'':sg(ds)}</span><span class="sg">${cur||sig==null?'':sg(ds/sig,1)+'σ'}</span></div>`;
  });
  return h+`</div>`;
}
function renderC3(f){
  if(f.pre) return preC3(f);
  const x=f.idxs[sel];
  let h=`<div class="h">Kahan · levels<small>sab FUT ke hisaab se, ek hi paimana</small></div>`;
  h+=`<div class="basis"><b>FUT = SPOT ${sg(x.basis)}</b> (abhi). STRIKE wale: strike + ${fm(x.basis)} = FUT barabar. Dono alag cheez hain.</div>`;
  h+=ladder(f,x);
  h+=`<div class="wl"><table><tr><th>OI deewar (spot strike)</th><th>OI</th><th>30m</th><th>FUT barabar</th></tr>`
   + x.walls.ce.map(w=>`<tr><td>CE ${fm(w[0])} <span class="c-dn">cap</span></td><td>${fm(Lk(w[1]))}L</td><td class="${w[2]>0?'c-dn':'c-gr'}">${sg(Lk(w[2]),1)}L</td><td>${fm(w[0]+x.basis)}</td></tr>`).join('')
   + x.walls.pe.map(w=>`<tr><td>PE ${fm(w[0])} <span class="c-up">floor</span></td><td>${fm(Lk(w[1]))}L</td><td class="${w[2]>0?'c-up':'c-gr'}">${sg(Lk(w[2]),1)}L</td><td>${fm(w[0]+x.basis)}</td></tr>`).join('')
   + `</table><div class="mini" style="margin-top:3px">Chain: subah ke ATM ±8 strike hi; bahar ki deewar nahi dikhti.</div></div>`;
  $('c3').innerHTML=h;
}
/* ---------- pre-open ---------- */
function preC1(f){
  let h=`<div class="h">Kal ka din · pichla poora session<small>kal subah ka data nahi → 6 Oct</small></div><table class="pre"><tr><th></th><th>Close F</th><th>Value (VAL–VAH)</th><th>POC</th></tr>`;
  IDX.forEach(i=>{const p=f.pre[i].prev; h+=`<tr><td>${i}</td><td>${fm(p.close)}</td><td>${fm(p.val)}–${fm(p.vah)}</td><td>${fm(p.poc)}</td></tr>`;});
  h+=`</table><div class="flipbox" style="margin-top:10px"><b>Khulte hi pehla sawaal</b><br>Open kal ki value (VAL–VAH) <b>ke bahar</b> aur wahin tike → trend ka mauka. Value <b>ke andar</b> → rotation, VWAP±σ par kaam. Gap kitna? <b>09:15 par hi pata chalega</b> — abhi nahi.</div>`;
  h+=`<div class="ev" style="margin-top:8px">${lt('n')}<div><div class="k">Aaj ki khabar / event</div><div class="v" style="color:var(--faint)">tum likho: ________</div><div class="u">tool ko khabar nahi pata — ye jagah tumhari</div></div></div>`;
  h+=`<div class="ev">${lt('n')}<div><div class="k">Kal raat ki OI deewar</div><div class="v">${IDX.map(i=>{const w=f.pre[i].walls;return i.slice(0,3)+' '+fm(w.pe[0][0])+'PE / '+fm(w.ce[0][0])+'CE';}).join(' · ')}</div><div class="u">spot strikes, 7 Oct close (chain ±8 strike)</div></div></div>`;
  $('c1').innerHTML=h;
}
function preC2(f){
  const exp=IDX.filter(i=>f.pre[i].expiry===f.day);
  let h=`<div class="h">Aaj kab kya pata chalega<small>jaldi ka matlab kam jaankari</small></div><div class="tl">
   <b>09:15</b><span>Open. Gap + kal ki value se. <i>Recorder 09:17 se</i> (pehle 2 min ka data nahi)</span>
   <b>09:17</b><span>Feed live: bhav, delta, OI. <b>Early lane</b> shuru — sirf aadha size, delta palte to nikal.</span>
   <b>~09:27</b><span>10 min ki OI flow → "kaun likh raha" pehli baar.</span>
   <b>~09:47</b><span>30 min: σ bands, VWAP side-time, crossing. Poora reading.</span>
   <b>10:15+</b><span>PIN ka faisla ab hi (range-used pehle jhootha).</span>
   <b>15:00</b><span>Sab band. Naya trade nahi (tumhari aadat; tool sirf yaad dilata hai).</span></div>`;
  h+=`<div class="flipbox" style="margin-top:12px"><b>Kaun sa index?</b><br>Pehle jisme din saaf ho; baraabar to jo pehle band toda. ${exp.length?`Aaj <b>${exp.join(', ')}</b> expiry — gamma tez: buy me zyada paisa per point, sell me theta tez par jhatka bhi.`:''}</div>`;
  h+=`<div class="note">Kal ke levels aur OI deewar: right panel. Pre-open me live OI nahi, isliye koi "state" nahi dikhta — jhoothi taraf mat jhuko.</div>`;
  $('c2').innerHTML=h;
}
function preC3(f){
  const p=f.pre[sel]; const cl=p.prev.close;
  const rows=[['Kal VAH',p.prev.vah],['Kal POC',p.prev.poc],['Kal VAL',p.prev.val],['Kal low',p.prev.lo],['Kal high',p.prev.hi],['Kal close',p.prev.close]].concat(p.prev.hvn.map(v=>['Kal HVN',v])).concat(p.prev.lvn.map(v=>['Kal LVN',v]));
  const bs=p.prev.close-p.spot_close;
  p.walls.ce.forEach(w=>rows.push(['CE wall '+w[0]+' (OI '+fm(Lk(w[1]))+'L)',w[0]+bs,'STRIKE']));
  p.walls.pe.forEach(w=>rows.push(['PE wall '+w[0]+' (OI '+fm(Lk(w[1]))+'L)',w[0]+bs,'STRIKE']));
  rows.sort((a,b)=>b[1]-a[1]);
  let h=`<div class="h">Kahan · kal ke levels · ${sel}<small>sab FUT ke hisaab se</small></div><div class="basis">Basis kal close par ≈ <b>FUT = SPOT ${sg(p.prev.close-p.spot_close)}</b>. Aaj subah naya naapo — ye roz badalta hai.</div><div class="lad">`;
  rows.forEach(r=>{const tag=r[2]||'FUT'; h+=`<div class="row"><span class="tg ${tag}">${tag}</span><span class="nm">${r[0]}</span><span class="px">${fm(r[1])}</span><span class="ds"></span><span class="sg"></span></div>`;});
  $('c3').innerHTML=h+`</div><div class="mini" style="margin-top:6px">${p.prev.day===f.day?'':'Pichla poora din '+p.prev.day.slice(8)+'/'+p.prev.day.slice(5,7)+' (7 Oct me subah ka data nahi).'}</div>`;
}
/* ---------- ribbon ---------- */
function renderRib(f){
  const t0=9*60+15, t1=15*60+30, W=t1-t0; const pct=m=>((m-t0)/W*100);
  const [h,mm]=f.time.split(':').map(Number); const nowm=h*60+mm;
  let hh=`<div class="h" style="margin-bottom:3px">Din ka safar · kab kya state thi<small>sirf ab tak ka — aage ka koi andaaza nahi</small></div>`;
  if(f.pre){ $('rib').innerHTML=hh+`<div class="mini">Pre-open: abhi koi safar nahi.</div>`; return; }
  const ticks=[9,10,11,12,13,14,15].map(H=>`<span style="left:${pct(H*60)}%">${H}:00</span>`).join('');
  IDX.forEach(i=>{ const x=f.idxs[i]; if(!x) return; const segs=x.ribbon.map(s=>{const a=s[0]/60,b=s[1]/60; return `<i title="${s[2]} ${DIRA[s[3]]}" style="left:${pct(a)}%;width:${pct(b)-pct(a)}%;background:${regColor(s[2],s[3])}"></i>`;}).join('');
    hh+=`<div class="rrow"><span class="l" style="${i===sel?'color:var(--ink)':''}">${i}</span><div class="track" ${i===sel?'style="height:13px"':''}>${segs}<span class="mk cut" style="left:${pct(15*60)}%"></span><span class="mk" style="left:${pct(nowm)}%"></span></div></div>`; });
  hh+=`<div class="axis">${ticks}</div>`;
  $('rib').innerHTML=hh;
}
function renderCtl(){
  const lab={PRE:'Pre',A:'A',B:'B',C:'C',D:'D',E:'E',F:'F',G:'G',H:'H',I:'I',J:'J'};
  let h=`<span class="lbl">MOCKUP · asli recorded minute (sirf tab tak ka data) →</span>`+FR.map((f,i)=>`<button class="${i===fi?'on':''}" onclick="setF(${i})" title="${f.label}">${lab[f.id]}·${f.pre?'pre':f.time}</button>`).join('');
  h+=`<span class="cp">${CAP[FR[fi].id]||''}</span>`;
  $('ctl').innerHTML=h;
}
const CAP={
 PRE:'Pre-open: sirf kal ka sach. Koi state nahi, jaan-boojh kar.',
 A:'8 Oct 09:20: teeno SAAF NAHI. 3 min ka data; kya kab pata chalega.',
 B:'8 Oct 09:50: NIFTY JHUKAAV ↓, aadha size. Baaki abhi saaf nahi.',
 C:'8 Oct 11:32: TREND ↓, entry check OK. BANKNIFTY ulta (↑), SENSEX aadha.',
 D:'8 Oct 12:10: udaharan trade. Flow ulta, zone+OI theek: WATCH, fold nahi.',
 E:'5 Oct 10:30: NIFTY/SENSEX saaf nahi, BANKNIFTY CHOP. Side nahi chunta.',
 F:'29 Sep 10:50: price VWAP ke niche par sirf put likh rahe: PALAT? (pehla ishara).',
 G:'30 Sep 13:46: udaharan trade, aadha size. Zone/flow/OI ulte: FOLD.',
 H:'25 Sep 12:35: NIFTY PIN 23,100. Sirf bechne wali taraf, wo bhi aadha.',
 I:'7 Oct 13:30: feed der se. Andaaza nahi, sawaal-chinh (?) dikhata hai.',
 J:'24 Sep 09:22: BANKNIFTY open se 1.3x tez + delta saath: early lane, aadha.'
};
function selIdx(i){ sel=i; render(); }
const DEFSEL={E:'BANKNIFTY',J:'BANKNIFTY'};
function setF(i){ fi=i; const f=FR[i]; if(f.trade) sel=f.trade.idx; else if(!f.pre){ sel=DEFSEL[f.id]||'NIFTY'; if(!f.idxs[sel]) sel='NIFTY'; } render(); }
function render(){ const f=FR[fi]; const hm=f.time.split(':').map(Number); EARLYCLOCK=(hm[0]*60+hm[1])<10*60+15; renderTop(f); renderStrip(f); renderC1(f); renderC2(f); renderC3(f); renderRib(f); renderCtl(); }
(function(){ const m=location.hash.match(/f=(\d+)/); const si=location.hash.match(/s=(\w+)/); setF(m?+m[1]:1); if(si&&FR[fi].idxs&&FR[fi].idxs[si[1]]){ sel=si[1]; render(); } })();
</script>
