    if (d.floor30 && d.floor30 !== d.floor) line(d.floor30, "#9fd0cb", "floor tha " + d.floor30.toLocaleString("en-IN") + "s", true);
    line(d.cap, "#C4452C", "CE cap · deewar " + (d.cap ? d.cap.toLocaleString("en-IN") : "") + "s" + (d.cap30 && d.cap30 !== d.cap ? " (upar roll)" : ""), false);
    line(d.floor, "#0B8277", "PE floor · deewar " + (d.floor ? d.floor.toLocaleString("en-IN") : "") + "s" + (d.floor30 && d.floor30 !== d.floor ? " (neeche roll)" : ""), false);
    // candles (her chart's bars, drawn here only so the layer has something to sit on)
    bars.forEach((b, i) => { const up = b.c >= b.o; g.strokeStyle = up ? "#148a4f" : "#c0392b"; g.fillStyle = up ? "#fff" : "#c0392b"; g.lineWidth = 1;
      g.beginPath(); g.moveTo(xi(i), y(b.h)); g.lineTo(xi(i), y(b.l)); g.stroke();
      const yo = y(b.o), yc = y(b.c), hh = Math.max(1, Math.abs(yc - yo)); g.fillRect(xi(i) - bw * 0.3, Math.min(yo, yc), bw * 0.6, hh); g.strokeRect(xi(i) - bw * 0.3, Math.min(yo, yc), bw * 0.6, hh); });
    // time axis
    g.fillStyle = "#6b7280"; g.font = "9.5px Cascadia Mono, Consolas, monospace"; g.textAlign = "center";
    bars.forEach((b, i) => { if (i % 3 === 0) g.fillText(b.t, xi(i), H - 2); });
    // marks: one ◆ per picture change at its bar, chip in the gutter (≤ 6 chips: newest first, the rest on hover)
    hit = [];
    const byBar = {}; d.stamps.forEach((st) => { const m = +st.t.slice(0, 2) * 60 + +st.t.slice(3, 5); const i = bars.findIndex((b) => b.m0 <= m && m < b.m0 + 5); if (i >= 0) (byBar[i] = byBar[i] || []).push(st); });
    const shown = Object.keys(byBar).map(Number).sort((a, b) => b - a);
    shown.forEach((i, rank) => { const sts = byBar[i], st = sts[sts.length - 1], k = st.word === "CHAL RAHA" || st.word === "WAPSI" ? st.word + (st.title.includes("▲") ? "+" : "-") : st.word;
      const ink = inkOf[k] || (st.word === "≠ READ" ? "#b4600a" : st.word === "ROLL" || st.word === "ROLL TOOTA" ? (st.title.startsWith("CE") ? "#C4452C" : "#0B8277") : "#374151");
      const yy = bot + 4 + ribH + 10, xx = xi(i);
      g.fillStyle = ink; g.beginPath(); g.moveTo(xx, yy - 5); g.lineTo(xx + 5, yy); g.lineTo(xx, yy + 5); g.lineTo(xx - 5, yy); g.closePath(); g.fill();
      if (rank < 6) { g.font = "bold 9.5px Segoe UI, sans-serif"; g.textAlign = "left"; g.fillStyle = ink; const txt = chip(st); const tw = g.measureText(txt).width;
        const tx = Math.min(xx + 7, W - padR - tw - 2); g.fillStyle = "#fff"; g.fillRect(tx - 2, yy - 7, tw + 4, 13); g.fillStyle = ink; g.fillText(txt, tx, yy + 3); }
      hit.push({ x: xx, y: yy, sts });
    });
    // header
    const p = d.picture, gr = p.grade ? ` ${p.grade.n}/${p.grade.N} ${p.grade.word}` : "";
    document.getElementById("ttl").textContent = `${d.idx} · ${d.day} · ${d.at} · ${p.word}${p.dir ? (p.dir > 0 ? " ▲" : " ▼") : ""}${gr}${p.phase ? " · " + p.phase : ""}`;
    const basis = d.basis == null ? "basis —" : `basis ${d.basis > 0 ? "+" : ""}${d.basis.toFixed(0)} (3-min median)`;
    document.getElementById("sub").textContent = `${p.story || ""}${p.qual ? " · " + p.qual : ""} · spot ${Math.round(bars[bars.length - 1].c).toLocaleString("en-IN")}s${d.fut ? " · fut " + Math.round(d.fut).toLocaleString("en-IN") + "f" : ""} · ${basis} · ref ${d.ref}`;
    document.getElementById("now").textContent = d.at;
    document.getElementById("budget").innerHTML = `<b>budget</b>: flat = 2 lines (CE cap + PE floor; a rolled wall keeps its old level dotted for 30 min) · in a trade = the trade's 5 lines own the budget and the walls stay only as ticks on the price axis · chips ≤ 6, newest first, ≤ 4 words + number · hover a ◆ for the story${d.contradiction ? " · <b>≠</b> " + d.contradiction : " · no ≠ line at this minute"}`;
  }
  C.addEventListener("mousemove", (e) => { const r = C.getBoundingClientRect(), x = e.clientX - r.left, yv = e.clientY - r.top; const h = hit.find((o) => Math.abs(o.x - x) < 8 && Math.abs(o.y - yv) < 10);
    if (!h) { tip.style.display = "none"; return; } tip.style.display = "block"; tip.style.left = Math.min(x + 12, (C.clientWidth || 1200) - 540) + "px"; tip.style.top = (yv - 10) + "px";
    tip.innerHTML = h.sts.map((st) => `<b>${st.t} ${st.title}</b>${st.grade ? " · " + st.grade : ""}<br><span class="m">${st.why}</span>`).join("<br>"); });
  C.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  window.addEventListener("resize", draw);
  draw();
})();
</script>
