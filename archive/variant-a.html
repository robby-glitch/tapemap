<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variant A — Terminal</title>
<style>
:root { --bg:#08090b; --pan:#0d0f12; --line:#1b1f26; --ink:#c9d4e0; --dim:#4d5866;
        --amber:#ffb454; --up:#3fd08b; --dn:#ff5d5d; --vio:#b98aff; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;
     font:12px/1.4 "Cascadia Code","Consolas",monospace;display:flex;flex-direction:column}
#top{display:flex;align-items:baseline;gap:26px;padding:10px 18px;border-bottom:1px solid var(--line)}
#top .sym{color:var(--amber);font-weight:700;letter-spacing:1px}
#top .st{font-size:20px;font-weight:700;color:var(--vio);letter-spacing:2px}
#top .why{color:var(--dim)}
#top .carry{margin-left:auto;color:var(--up);font-size:11px}
#main{flex:1;display:flex;min-height:0}
#chart{flex:1;padding:6px 0 0 0}
svg{width:100%;height:100%;display:block}
#side{width:300px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.hd{color:var(--dim);font-size:10px;letter-spacing:2px;padding:10px 14px 4px}
#books{padding:0 14px}
#books .r{display:grid;grid-template-columns:34px 1fr 52px 62px;gap:8px;
          padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#books .r b{font-weight:400;color:var(--dim)}
#log{flex:1;overflow-y:auto;padding:4px 0 14px;font-size:11px}
#log .e{padding:3px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .e:hover{background:var(--pan);white-space:normal}
#log .t{color:var(--dim)}
</style>
</head>
<body>
<div id="top">
  <span class="sym">NIFTY 24200 · JUL 17</span>
  <span class="st" id="st">—</span><span class="why" id="why"></span>
  <span class="carry" id="carry"></span>
</div>
<div id="main">
  <div id="chart"><svg id="svg"></svg></div>
  <div id="side">
    <div class="hd">BOOKS · 14:15</div>
    <div id="books"></div>
    <div class="hd">TAPE LOG</div>
    <div id="log"></div>
  </div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const el=(p,t,a={},tx)=>{const n=document.createElementNS(NS,t);
  for(const[k,v]of Object.entries(a))n.setAttribute(k,v);
  if(tx!==undefined)n.textContent=tx;p.appendChild(n);return n};
(async()=>{
const D=(await(await fetch("/api/data")).json()).days[2];
const bars=D.bars,n=bars.length;
document.getElementById("st").textContent="ARMED";
document.getElementById("why").textContent="// spring live (bullish) @ R1";
document.getElementById("carry").textContent="CARRY: BULLISH → Mon";
const i15=bars.findIndex(b=>b.t==="14:15");
const bk=document.getElementById("books");
for(const[k,lbl]of[["fut","FUT"],["ce","CE"],["pe","PE"]]){
  const b=bars[i15][k];
  bk.insertAdjacentHTML("beforeend",
   `<div class="r"><b>${lbl}</b><span style="text-align:right">${b.c.toFixed(k==="fut"?0:1)}</span>`+
   `<span style="text-align:right;color:${b.z>1?"#3fd08b":b.z<-1?"#ff5d5d":"#4d5866"}">z${b.z.toFixed(1)}</span>`+
   `<span style="text-align:right;color:${b.oi_slope>0?"#3fd08b":"#ff5d5d"}">${b.oi_slope>0?"+":""}${Math.round(b.oi_slope/1000)}k</span></div>`);
}
const log=document.getElementById("log");
for(const e of D.events){
  if(e.kind==="STATE")continue;
  const col={ARMED:"#b98aff",SPRING:"#b98aff",IGNITION:"#ffb454",CLIMAX:"#ffb454",
             TRAP:"#ff5d5d",DIVERGENCE:"#ff5d5d",CARRY:"#3fd08b","FLIP-TEST":"#3fd08b"}[e.kind]||"#4d5866";
  log.insertAdjacentHTML("beforeend",
    `<div class="e"><span class="t">${e.t}</span> <span style="color:${col}">${e.kind}</span> <span style="color:#8b98a8">${e.msg}</span></div>`);
}
const svg=document.getElementById("svg");
const W=svg.clientWidth||900,H=svg.clientHeight||600;
const x0=54,x1=W-56,x=i=>x0+(x1-x0)*i/(n-1);
const pT=20,pB=H*0.62, oT=pB+34,oB=H*0.80, vT=oB+18,vB=H-34;
const lo=Math.min(...bars.map(b=>b.fut.l)),hi=Math.max(...bars.map(b=>b.fut.h));
const pd=(hi-lo)*.05, py=p=>pT+(pB-pT)*(1-(p-(lo-pd))/((hi+pd)-(lo-pd)));
for(let p=Math.ceil(lo/50)*50;p<=hi;p+=50){
  el(svg,"line",{x1:x0,y1:py(p),x2:x1,y2:py(p),stroke:"#12151a"});
  el(svg,"text",{x:x1+4,y:py(p)+3,"font-size":10,fill:"#4d5866"},p);
}
for(const[nm,p]of Object.entries(D.pivots)){if(p<lo-pd||p>hi+pd)continue;
  el(svg,"line",{x1:x0,y1:py(p),x2:x1,y2:py(p),stroke:"#242a33","stroke-dasharray":"6 4"});
  el(svg,"text",{x:x0-4,y:py(p)+3,"text-anchor":"end","font-size":10,fill:"#4d5866"},nm);}
const yk=py(D.strike);
el(svg,"line",{x1:x0,y1:yk,x2:x1,y2:yk,stroke:"#b98aff",opacity:.55});
el(svg,"text",{x:x0-4,y:yk+3,"text-anchor":"end","font-size":10,fill:"#b98aff"},"STK");
let d="";bars.forEach((b,i)=>d+=(i?"L":"M")+x(i)+" "+py(b.fut.vwap)+" ");
el(svg,"path",{d,fill:"none",stroke:"#ffb454","stroke-width":1,"stroke-dasharray":"1 3"});
d="";bars.forEach((b,i)=>d+=(i?"L":"M")+x(i)+" "+py(b.fut.c)+" ");
el(svg,"path",{d,fill:"none",stroke:"#c9d4e0","stroke-width":1.3});
const tI=Object.fromEntries(bars.map((b,i)=>[b.t,i]));
for(const e of D.events){
  if(!["ARMED","IGNITION","CLIMAX","CARRY"].includes(e.kind))continue;
  const i=tI[e.t];if(i===undefined)continue;
  const col={ARMED:"#b98aff",IGNITION:"#ffb454",CLIMAX:"#ffb454",CARRY:"#3fd08b"}[e.kind];
  el(svg,"line",{x1:x(i),y1:pT,x2:x(i),y2:vB,stroke:col,opacity:.28});
  el(svg,"text",{x:x(i)+3,y:pT+10,"font-size":10,fill:col},e.kind+" "+e.t);
}
const nrm=g=>{const v=bars.map(g),m=Math.min(...v),M=Math.max(...v);return q=>(q-m)/(M-m||1)};
for(const[k,c]of[["ce","#3fd08b"],["pe","#ff5d5d"]]){
  const f=nrm(b=>b[k].oi);d="";
  bars.forEach((b,i)=>d+=(i?"L":"M")+x(i)+" "+(oB-(oB-oT)*f(b[k].oi))+" ");
  el(svg,"path",{d,fill:"none",stroke:c,"stroke-width":1.1});}
el(svg,"text",{x:x0-4,y:oT+8,"text-anchor":"end","font-size":10,fill:"#4d5866"},"OI");
for(let i=0;i<n;i++){
  const v=Math.max(bars[i].fut.vol_r,bars[i].ce.vol_r,bars[i].pe.vol_r);
  if(v<.5)continue;
  const h=(vB-vT)*((v-.5)/.5)**2;
  el(svg,"rect",{x:x(i)-.7,y:vB-h,width:1.6,height:h,fill:"#ffb454",opacity:.85});}
el(svg,"text",{x:x0-4,y:vB,"text-anchor":"end","font-size":10,fill:"#4d5866"},"VOL");
bars.forEach((b,i)=>{if(b.t.endsWith(":00")){
  el(svg,"text",{x:x(i),y:H-12,"text-anchor":"middle","font-size":10,fill:"#4d5866"},b.t);}});
})();
</script>
</body>
</html>
